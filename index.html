<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yu Tiantian | Visual Artist</title>

    <!-- Google 搜索摘要配置 -->
    <meta name="description" content="Yu Tiantian is a visual artist working across painting, printmaking, and installation." />
    <meta name="robots" content="max-image-preview:large" />
    <link rel="canonical" href="https://www.yutiantian.com/" />

    <!-- 社交平台与搜索引擎共用的首页摘要 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yu Tiantian" />
    <meta property="og:title" content="Yu Tiantian | Visual Artist" />
    <meta property="og:description" content="Yu Tiantian is a visual artist working across painting, printmaking, and installation." />
    <meta property="og:url" content="https://www.yutiantian.com/" />
    <meta property="og:image" content="https://www.yutiantian.com/og-image.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Artwork by Yu Tiantian" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yu Tiantian | Visual Artist" />
    <meta name="twitter:description" content="Yu Tiantian is a visual artist working across painting, printmaking, and installation." />
    <meta name="twitter:image" content="https://www.yutiantian.com/og-image.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "url": "https://www.yutiantian.com/",
        "name": "Yu Tiantian | Visual Artist",
        "description": "Yu Tiantian is a visual artist working across painting, printmaking, and installation.",
        "primaryImageOfPage": {
          "@type": "ImageObject",
          "contentUrl": "https://www.yutiantian.com/og-image.jpg",
          "caption": "Artwork by Yu Tiantian"
        },
        "mainEntity": {
          "@type": "Person",
          "name": "Yu Tiantian",
          "url": "https://www.yutiantian.com/",
          "image": "https://www.yutiantian.com/og-image.jpg"
        }
      }
    </script>

    <!-- Favicon 图标配置 -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260812" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260812" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260812" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260812" />
    <meta name="apple-mobile-web-app-title" content="Yu Tiantian" />
    <link rel="manifest" href="/site.webmanifest?v=20260812" />

    <!-- 用 CDN 引入 Tailwind -->
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        future: {
          hoverOnlyWhenSupported: true,
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 去掉手机浏览器点击时自带的灰色高亮提示 */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* 详情页点 Next：内容从右边滑入 */
      @keyframes slideInFromRight {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* 详情页点 Previous：内容从左边滑入 */
      @keyframes slideInFromLeft {
        from {
          opacity: 0;
          transform: translateX(-24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* 图片保护 */
      img {
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yu Tiantian</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 用 CDN 引入 Tailwind，简单省事，不需要额外的构建配置 -->
    <script>
      // 必须在加载 Tailwind 之前配置：让所有 hover: 样式（鼠标悬停变色/变灰这些）
      // 只在真正支持"悬停"的设备（比如带鼠标的电脑）上生效。
      // 手机是触屏，没有真正的悬停概念，浏览器会把"点一下"误判成"悬停"，
      // 而且这个状态不会像鼠标移开那样自动清除，就会一直卡在"变灰"的样子——
      // 加了这个配置之后，触屏设备完全不会触发 hover: 样式，从根上不会再卡住。
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        future: {
          hoverOnlyWhenSupported: true,
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 去掉手机浏览器点击时自带的灰色高亮提示 */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* 详情页点 Next：内容从右边滑入 */
      @keyframes slideInFromRight {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* 详情页点 Previous：内容从左边滑入 */
      @keyframes slideInFromLeft {
        from {
          opacity: 0;
          transform: translateX(-24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* 图片保护：禁止拖拽把图片存到桌面、禁止选中、禁止手机长按弹出"保存图片"菜单。
         提前说明：这只能挡住大部分"随手右键/长按存图"的情况，没有任何纯前端手段能
         100% 防住截图或者用浏览器"开发者工具"看网络请求这类操作。 */
      img {
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
